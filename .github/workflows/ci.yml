name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: dom example renders
        run: node bin/motigen.js build -C examples/hello-dom --range 0-2 --preset ultrafast -j 2
      - name: canvas example renders both formats with its in-page mix
        run: node bin/motigen.js build -C examples/hello-canvas --range 0-2 --preset ultrafast -j 2
      - name: guide example records a take and renders it
        run: |
          cd examples/hello-guide
          node ../../bin/motigen.js record take.mjs
          node ../../bin/motigen.js build --range 0-6 --preset ultrafast -j 2
          node ../../bin/motigen.js frames -t 1,6,16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders
          path: |
            examples/*/out/*.mp4
            examples/*/shots/*.jpg
          if-no-files-found: ignore
