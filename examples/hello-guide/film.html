<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hello-guide</title>
<link rel="stylesheet" href="/_motigen/vendor/xterm/css/xterm.css">
<link rel="stylesheet" href="/_motigen/guide/player.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div id="stage">
  <div id="cam">
    <div class="win" id="browser">
      <div class="bar"><div class="dots"><i></i><i></i><i></i></div>
        <div class="url"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 7V5a4 4 0 118 0v2h.5A1.5 1.5 0 0114 8.5v5a1.5 1.5 0 01-1.5 1.5h-9A1.5 1.5 0 012 13.5v-5A1.5 1.5 0 013.5 7H4zm2 0h4V5a2 2 0 10-4 0v2z"/></svg><b id="host"></b><span id="path"></span></div>
      </div>
      <div class="view" id="bview"><div class="content" id="bcontent"><img id="shot" alt="">
        <svg id="cursor" viewBox="0 0 24 24"><path d="M5 2.5l14 10.2-6.3 1 3.7 7.1-2.7 1.4-3.7-7.2L5 19.3z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div></div>
    </div>
    <div class="win" id="terminal">
      <div class="bar"><div class="dots"><i></i><i></i><i></i></div><span>you@laptop: ~</span></div>
      <div class="view" id="tview"><div class="content" id="tcontent"><div id="xt"></div></div></div>
    </div>
  </div>
  <div id="chapter"><span class="n"></span><span class="t"></span></div>
  <img id="brandmark" src="brand.svg" alt="">
  <div id="key"><kbd>Enter</kbd><span></span></div>
  <div id="note"></div>
  <div class="card" id="card"></div>
</div>
<script src="/_motigen/vendor/xterm/lib/xterm.js"></script>
<script type="module" src="/_motigen/guide/player.js"></script>
</body>
</html>
